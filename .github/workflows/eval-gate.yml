name: eval-gate

# Replays every configuration from the committed response cache (no API key, no secrets), aggregates, and compares
# against evals/results/baseline.csv. Fails on a cache miss (prompt/model/judge change without a refreshed cache) or on
# any metric dropping by more than its threshold in evals/thresholds.json. Posts one sticky PR comment with the table.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eval-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  EVALS: dotnet src/InvoiceEvals.Cli/bin/Release/net10.0/evals.dll

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

      - name: Replay every config from the committed cache
        id: run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          status=0
          for config in $(jq -r '.[].name' evals/configs.json); do
            $EVALS run --config "$config" --offline 2>&1 | tee -a run.log || status=1
          done
          exit $status

      - name: Report
        if: steps.run.outcome == 'success'
        run: $EVALS report

      - name: Gate
        id: gate
        if: steps.run.outcome == 'success'
        continue-on-error: true
        run: $EVALS gate --markdown-out gate.md

      - name: Compose comment
        if: always()
        shell: bash
        run: |
          {
            echo '<!-- eval-gate -->'
            if [ "${{ steps.run.outcome }}" != "success" ]; then
              echo '### ❌ Eval gate: offline replay failed'
              echo
              echo 'CI replays model responses from `evals/cache/` and never calls the API. This PR needs responses that are not cached:'
              echo
              echo '```'
              grep -E -A5 '^Cache miss|FAILED' run.log | head -60 || echo 'See the workflow log.'
              echo '```'
            elif [ -f gate.md ]; then
              cat gate.md
            else
              echo '### ❌ Eval gate did not produce a result; see the workflow log.'
            fi
            echo
            echo "<sub>Head ${{ github.event.pull_request.head.sha }} · [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs get a read-only token; their table is in the job summary instead.
      - name: Post or update the sticky comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- eval-gate -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail on cache miss or regression
        if: steps.run.outcome != 'success' || steps.gate.outcome != 'success'
        run: exit 1
